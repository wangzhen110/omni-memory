<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>全息记忆</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="bar">
  <div class="brand">
    <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="1.2"/><circle cx="12" cy="12" r="3.2" fill="currentColor"/></svg>
    <span>全息记忆</span>
  </div>
  <nav class="tabs">
    <a class="tab" href="/hub" style="text-decoration:none">中枢</a>
    <a class="tab" href="/" style="text-decoration:none">概览</a>
    <button class="tab is-active" data-tab="list">记忆</button>
    <button class="tab" data-tab="map">星图</button>
    <button class="tab" data-tab="rules">规则</button>
  </nav>
  <div class="stats" id="stats"></div>
</header>

<main>
  <section class="panel is-active" id="panel-list">
    <div class="toolbar">
      <input id="q" type="search" placeholder="搜索记忆：关键词、实体、路径，或错误码" autocomplete="off">
      <select id="scope">
        <option value="all">全部层级</option>
        <option value="project">仅项目层</option>
        <option value="global">仅全局层</option>
      </select>
      <label class="switch"><input type="checkbox" id="audit"> 审计视图</label>
    </div>
    <div class="list" id="list"></div>
  </section>

  <section class="panel" id="panel-map">
    <div class="canvas-wrap map-wrap">
      <iframe id="starFrame" data-src="/star-map.html?embed=1" title="记忆星图" allow="fullscreen"></iframe>
    </div>
  </section>

  <section class="panel" id="panel-rules">
    <div class="rules" id="rules">加载中…</div>
  </section>
</main>

<script src="/app.js"></script>
</body>
</html>
