<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1517">
<title>全息记忆 · 本机底稿</title>
<link rel="stylesheet" href="/mobile.css">
</head>
<body>
<header class="m-top">
  <div class="m-top-inner">
    <a class="m-brand" href="/hub" aria-label="返回记忆索引">
      <span class="m-seal" aria-hidden="true">息</span>
      <span class="m-brand-copy"><b>全息记忆</b><small>本机记忆档案</small></span>
    </a>
    <span class="m-online" id="online"><i></i>连接中</span>
  </div>
</header>

<main class="m-main">
  <div class="m-error" id="mError" role="alert"></div>

  <section class="m-hero">
    <p class="m-eyebrow">本机记忆 · 只读</p>
    <h1>记忆不在云端，<br><em>在这份底稿里。</em></h1>
    <p>换模型、换宿主、重启之后，接上同一个本地库，它仍然在。</p>
    <div class="m-stats">
      <span><b id="mMemory">—</b> 条活跃</span>
      <span><b id="mHealth">—</b>/100 健康</span>
      <span><b id="mTools">—</b> 个工具</span>
    </div>
  </section>

  <section class="m-search-wrap" aria-label="搜索记忆">
    <label class="m-search">
      <span class="m-search-icon" aria-hidden="true">⌕</span>
      <input id="mQuery" type="search" inputmode="search" enterkeyhint="search" placeholder="翻一条旧记忆…" autocomplete="off">
      <button id="mClear" type="button" aria-label="清空搜索" hidden>×</button>
    </label>
    <p class="m-search-hint" id="mHint">最近归档 · 点开一条看全文</p>
  </section>

  <section class="m-list" id="mList" aria-live="polite">
    <div class="m-skeleton"></div>
    <div class="m-skeleton"></div>
    <div class="m-skeleton"></div>
  </section>

  <section class="m-links">
    <a href="/hub">记忆索引 <span>→</span></a>
    <a href="/star-map.html">完整关系图 <span>↗</span></a>
  </section>
</main>

<nav class="m-nav" aria-label="手机端导航">
  <div class="m-nav-inner">
    <a href="/hub"><span class="m-nav-icon">◈</span>索引</a>
    <a class="active" href="/m"><span class="m-nav-icon">⌕</span>翻阅</a>
    <a href="/"><span class="m-nav-icon">▦</span>概览</a>
  </div>
</nav>

<script src="/base.js"></script>
<script src="/mobile.js"></script>
</body>
</html>
