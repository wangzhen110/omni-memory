name: 商业例外申请
description: 申请「全息记忆 (Omni Memory)」的闭源商业例外许可
title: "[商业例外] "
body:
  - type: markdown
    attributes:
      value: |
        本项目采用 **AGPL-3.0-only**：可以自由商用，但闭源分发或闭源 SaaS 需要满足 AGPL 源码义务。
        如果你的场景无法满足，请填写以下信息申请商业例外；作者会通过你留下的联系方式回复授权范围与费用。

        > 提示：请勿在 Issue 中填写身份证号、银行卡等敏感信息。

  - type: input
    id: company
    attributes:
      label: 公司 / 团队名称
      placeholder: 例如：某某科技有限公司（个人商用可填「个人」）
    validations:
      required: true

  - type: textarea
    id: usage
    attributes:
      label: 使用场景
      description: 越具体越好，例如：内部工具 / 对外 SaaS / 客户项目交付 / 二次开发后销售
      placeholder: |
        - 使用方式：在内部知识库系统中集成
        - 是否修改源码：是 / 否
        - 预计部署规模：50 人 / 1000 用户
    validations:
      required: true

  - type: input
    id: contact
    attributes:
      label: 联系方式
      description: 邮箱或其他可联系到你的方式
      placeholder: name@example.com
    validations:
      required: true

  - type: dropdown
    id: license-type
    attributes:
      label: 期望的授权类型
      options:
        - 闭源产品 / 插件
        - 闭源 SaaS / 托管
        - OEM / 嵌入硬件
        - 企业采购合同 / 特殊条款
        - 暂不确定，希望先沟通
    validations:
      required: true

  - type: checkboxes
    id: agree
    attributes:
      label: 确认
      options:
        - label: 我理解 AGPL-3.0-only 允许商用，但闭源分发/闭源 SaaS 需要商业例外或履行源码义务
          required: true
